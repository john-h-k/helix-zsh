[package]
name = "helix-driver"
version = "0.1.0"
edition = "2021"
description = "Driver for building helix-compatible keybindings"
license = "MIT"
repository = "https://github.com/john-h-k/helix-zsh"
authors = ["John Harry Kelly <johnharrykelly@gmail.com>"]


[dependencies]
arc-swap = "1.7.1"
clap = { version = "4.5.27", features = ["derive"] }

helix-core = { git = "https://github.com/helix-editor/helix.git" }
helix-view = { git = "https://github.com/helix-editor/helix.git" }
helix-loader = { git = "https://github.com/helix-editor/helix.git" }
helix-term = { git = "https://github.com/helix-editor/helix.git" }
helix-event = { git = "https://github.com/helix-editor/helix.git" }

# Pin gix-actor to 0.40.0 because 0.40.1 upgraded to winnow 1.0 which is incompatible
# with gix-object 0.57.0's use of winnow 0.7.x.
gix-actor = "=0.40.0"
toml = "0.8.19"
tokio =  { version = "1.43.0", features = ["io-util"] }
anyhow = "1.0.95"
env_logger = "0.11.6"
log = "0.4.25"
